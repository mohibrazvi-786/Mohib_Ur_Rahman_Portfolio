title = "Gitleaks configuration for shaikhmohibsm Portfolio"

[[rules]]
id = "generic-api-key"
description = "Generic API key detection"
regex = '''((?i)api[_-]?key(?:["'\''[:space:]]*[:=]["'\''[:space:]]*|[:=]["'\''[:space:]]*)["'\'']{0,1}([0-9a-zA-Z_\-]{20,})["'\'']{0,1})'''
secretGroup = 2

[[rules]]
id = "generic-secret"
description = "Generic secret detection"
regex = '''((?i)(?:secret|token|password|passwd|pwd)(?:["'\''[:space:]]*[:=]["'\''[:space:]]*|[:=]["'\''[:space:]]*)["'\'']{0,1}([0-9a-zA-Z_\-]{20,})["'\'']{0,1})'''
secretGroup = 2

[[rules]]
id = "aws-access-key"
description = "AWS access key ID"
regex = '''AKIA[0-9A-Z]{16}'''

[[rules]]
id = "aws-secret-key"
description = "AWS secret access key"
regex = '''(?i)aws(?:[_-]?secret[_-]?access[_-]?key|[_-]?secret[_-]?key)(?:["'\''[:space:]]*[:=]["'\''[:space:]]*|[:=]["'\''[:space:]]*)["'\'']{0,1}([0-9a-zA-Z_/+]{40})["'\'']{0,1}'''
secretGroup = 2

[[rules]]
id = "github-token"
description = "GitHub personal access token"
regex = '''ghp_[0-9a-zA-Z]{36}'''

[[rules]]
id = "slack-token"
description = "Slack token"
regex = '''xox[baprs]-[0-9a-zA-Z\-]+'''

[[rules]]
id = "private-key"
description = "Private key block"
regex = '''-----BEGIN [A-Z ]*PRIVATE KEY-----'''

allowlist = [
  # Test fixtures and example values that are not real secrets
  'example\.com',
  'localhost',
  '127\.0\.0\.1',
  '0\.0\.0\.0',
  # Documentation references
  'GITLEAKS_LICENSE',
  'secrets\.',
  # BuildOS public contact (intentionally public)
  'shaikhmohibsm@gmail\.com',
]
